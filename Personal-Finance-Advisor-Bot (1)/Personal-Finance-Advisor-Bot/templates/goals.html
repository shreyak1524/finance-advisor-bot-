{% extends "base.html" %}
{% set active_page = 'goals' %}
{% block title %}Goals - Personal Finance Advisor Bot{% endblock %}
{% block content %}

<div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-2">
  <div>
    <h1 class="page-title">Financial Goals</h1>
    <p class="page-subtitle text-muted mb-0">Set targets and track your progress</p>
  </div>
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#goalModal" id="addGoalBtn">
    <i class="fa-solid fa-plus"></i> Add Goal
  </button>
</div>

<div class="row g-3 mt-1" id="goalsContainer">
  <div class="col-12 text-center text-muted py-4">Loading goals...</div>
</div>

<!-- Add/Edit Goal Modal -->
<div class="modal fade" id="goalModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="goalForm">
        <div class="modal-header">
          <h5 class="modal-title" id="goalModalTitle">Add Goal</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="goalId">
          <div id="goalFormError" class="alert alert-danger d-none"></div>
          <div class="mb-3">
            <label class="form-label">Goal Name</label>
            <select class="form-select" id="goalName">
              {% for g in goal_types %}
              <option value="{{ g }}">{{ g }}</option>
              {% endfor %}
            </select>
            <input type="text" class="form-control mt-2 d-none" id="goalNameCustom" placeholder="Enter custom goal name">
          </div>
          <div class="mb-3">
            <label class="form-label">Target Amount (₹)</label>
            <input type="number" step="0.01" min="0.01" class="form-control" id="goalTarget" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Currently Saved (₹)</label>
            <input type="number" step="0.01" min="0" class="form-control" id="goalCurrent" value="0">
          </div>
          <div class="mb-3">
            <label class="form-label">Target Date (optional)</label>
            <input type="date" class="form-control" id="goalDate">
          </div>
          <div class="mb-3">
            <label class="form-label">Description (optional)</label>
            <textarea class="form-control" id="goalDescription" rows="2"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Goal</button>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/goals.js') }}"></script>
{% endblock %}
